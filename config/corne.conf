# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Клавиатура всегда активна (не засыпает)
CONFIG_ZMK_SLEEP=n

# Усиление сигнала Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Фикс подключения к macOS по BLE
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# КЛЮЧЕВОЙ ФИX: принудительно выводить всё через USB (0=USB, 1=BLE)
# Лог показал, что kscan и keymap работают, но репорты уходят в BLE вместо USB
CONFIG_ZMK_OUTPUT_DEFAULT=0

# Явное имя клавиатуры
CONFIG_ZMK_KEYBOARD_NAME="Corne"
