---
include:
  # Основные прошивки
  - board: nice_nano@2.0.0
    shield: corne_left
  - board: nice_nano@2.0.0
    shield: corne_right

  # [ДИАГНОСТИКА] USB-only: полное отключение BLE + без NVS
  # Цель: убрать ожидание периферии по BLE, форсировать USB HID
  # Если HID-интерфейс появится в ioreg — причина найдена
  - board: nice_nano@2.0.0
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_BLE=n -DCONFIG_SETTINGS_NONE=y
    artifact-name: corne_left_usb_only

  # Сброс настроек (NVS reset)
  - board: nice_nano@2.0.0
    shield: settings_reset
